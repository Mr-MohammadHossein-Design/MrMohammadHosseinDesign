<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فروشگاه فایل</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma, Arial, sans-serif;
}

body{
    background:#050505;
    color:white;
}


header{
    background:#111;
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    font-size:26px;
    font-weight:bold;
}


nav a{
    color:white;
    text-decoration:none;
    margin-right:20px;
}



.hero{
    text-align:center;
    padding:80px 20px;
}


.hero h1{
    font-size:45px;
    margin-bottom:20px;
}


.hero p{
    color:#aaa;
}



.products{
    display:flex;
    justify-content:center;
    padding:30px;
}


.card{

    width:360px;
    background:#151515;
    padding:25px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 30px #000;

}


.card img{

    width:100%;
    border-radius:20px;

}



.card h2{

    margin:20px 0;

}



.card p{

    color:#aaa;

}



.download-btn{

    display:inline-block;
    margin-top:25px;
    padding:15px 45px;
    background:white;
    color:black;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;

}



.download-btn:hover{

    transform:scale(1.05);

}



footer{

    text-align:center;
    padding:40px;
    color:#777;

}



@media(max-width:700px){

header{

    flex-direction:column;
    gap:20px;

}


.hero h1{

    font-size:32px;

}


.card{

    width:100%;

}

}

</style>

</head>


<body>


<header>

<div class="logo">
فروشگاه فایل
</div>


<nav>

<a href="#">
خانه
</a>

<a href="#">
محصولات
</a>

</nav>

</header>



<section class="hero">

<h1>
پک عکس با کیفیت
</h1>

<p>
مجموعه تصاویر با کیفیت بالا
</p>

</section>




<section class="products">


<div class="card">


<img src="https://picsum.photos/600/400" alt="پک عکس">


<h2>
پک عکس با کیفیت امام شهید سید علی خامنه ای
</h2>


<p>
دانلود مجموعه تصاویر با کیفیت
</p>



<a class="download-btn" href="files/photo-pack.zip" download>
دانلود مستقیم
</a>


</div>


</section>



<footer>

تمامی حقوق محفوظ است

</footer>


</body>

</html>
